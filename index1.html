const BE=[["Authentication","Fictional user, no sign-in","Real accounts, sessions, roles"],["Profile","Held in memory only","Persisted profile, skills, verified experience"],["Jobs and search","8 sample jobs, client-side filter","Job service, indexed search, saved searches"],["Applications","Simulated, nothing sent","Application records, employer workflow"],["Contracts and interviews","Sample records and statuses","Contract lifecycle, signed PDF, scheduling"],["Training and assessments","Sample progress","Progress tracking, graded assessments"],["Certificates","Marked DEMO ONLY","Issuer integration, verification codes"],["Notifications","Local read flags","Event service, delivery preferences"],["Earnings and subscription","Illustrative numbers","Payments provider, invoicing, billing"]];

const CMP=[["OneStopNDT","News, Articles, Interviews, Webinars, NDT Talks, Events, Directory, NDT Trends, More; separate sign-in for users and companies","Content-led home: latest news, featured and trending articles, a monthly magazine, interviews, events and a company directory. Jobs and Courses are linked from the footer","Verified company profiles with quote requests; user profile not inspected","Weekly newsletter, monthly magazine, events calendar, mobile app","Observed: homepage, 22 Oct 2026. Jobs and Courses pages not opened"],["NDT Worldwide","Home, About, Courses (dropdown by NDT method), Services, Course Schedule, Gallery, Contact","Marketing page: course list, why-us, testimonials, mobile app. No jobs seen","No learner profile seen","Course schedule and a mobile app; testimonials mention recorded classes","Observed: homepage, 22 Oct 2026"],["Energy JobSearch","Home, For you, New search, Profile, Career guide, Jobs, Companies; link for employers","Results first: filters, Set alert, list with company, location, date, level and type; follow companies; top companies hiring","Profile and resume upload; no training seen","Job alerts, For you tab, followed companies; mobile bar of Home, For you, Search, Profile, More","Observed: oil and gas search page, 22 Oct 2026"],["LinkedIn","Home, My Network, Jobs, Messaging, Notifications, Me, Search","Feed of updates and posts","Suggested skills; certifications section; course certificates can be added to the profile","Feed, notifications, profile views","Help and blog pages; navigation list is from a 2017 redesign post and may have changed"],["Upwork","Home, Jobs, Profile (app description)","Dashboard with job recommendations and updates","Portfolio, skills and talent badges","Recommendations, invites, saved searches","Help and guide articles, not the live site"],["Coursera","Explore, My Learning, profile menu","Learning dashboard showing progress","Skills profile for recruiters; shareable, verifiable certificates","Progress tracking and certificates","University help pages, not the live site"],["Credly","Not inspected","Not applicable (badge wallet)","Shareable, verifiable badge profile with privacy settings","Labour-market insights and job listings tied to skills","Issuer FAQ pages, not the live site"],["Fiverr","Not verified","Not verified","Not verified","Not verified","Not verified in this build"],["Naukri","Not verified","Not verified","Not verified","Not verified","Not verified in this build"],["Wellfound","Not verified","Not verified","Not verified","Not verified","Not verified in this build"]];
R.rationale=()=>{const t=tabOf("rt","Summary"),T=["Summary","Navigation map","Feature map","Comparison","Mobile view","Backend & reuse","Limits & next steps"],P={};
P["Problem & current state"]=`<div class="card rt"><h2>What the current freelancer app shows</h2><p><b>Observed in the current-app screenshots:</b> a dark layout with a persistent sidebar (Dashboard, Jobs, Contracts, Training, Assessments, Certificates, Reports, with more items possibly below the fold), a Replay Tutorial button and bell in the header, a support banner, a "Help us improve" card, and a dashboard made of a welcome panel and six count tiles (New Jobs, Applications, Active Work, Trainings, Certificates, Skills). The contracts page has a before-you-start notice, four summary tiles and status filters from All to Terminated.</p><h3>Pain points (our reading of those screens)</h3><ul><li>The welcome panel describes the platform but offers nothing to do; there is no search or opportunity on the landing view.</li><li>The tiles are counts, so the dashboard reports status rather than helping people discover work or learning.</li><li>Jobs, training, assessments and certificates sit as separate sections with no visible links between them.</li><li>No global search or feed is visible, so there is little reason to come back and browse.</li></ul><p class="sm mu">Not seen: any sidebar item below Reports, other screens, or the source code (the app source were not reviewed).</p></div>`;
P["Navigation map"]=`<div class="grid g2"><div class="card rt"><h3>Before (observed, partial)</h3><div class="flow"><span>Dashboard</span><span>Jobs</span><span>Contracts</span><span>Training</span><span>Assessments</span><span>Certificates</span><span>Reports</span><span>(more not captured)</span></div><p class="sm mu">Header: Replay Tutorial, bell. Sidebar footer: feedback card and user card. A flat list with the dashboard as the only landing page.</p></div><div class="card rt"><h3>After (this prototype)</h3><div class="flow"><span>Home &amp; Jobs</span><span>Contracts &amp; Interviews</span><span>Learning &amp; Assessments</span><span>Activity &amp; Earnings</span><span>Wiki &amp; AI Assistant</span><span>My Profile</span><span>More</span></div><p class="sm mu">Header adds global search. Home becomes a feed. Learning items share one sub-menu. Desktop: one click to any section. Mobile: bottom bar plus More (two taps).</p></div></div>`;
P["Architecture"]=`<div class="card rt"><h3>Navigation groups</h3><ul><li><b>Home &amp; Jobs</b>: the feed and the main discovery workflow.</li><li><b>Contracts &amp; Interviews</b>: what follows a match.</li><li><b>Learning &amp; Assessments</b>: training, assessments and certificates as one path.</li><li><b>Activity &amp; Earnings</b>: two tabs, with Reports beside it.</li><li><b>Wiki &amp; AI Assistant</b>: help and guidance.</li><li><b>My Profile</b>: profile, notifications and subscription.</li><li><b>More</b>: this rationale.</li></ul></div>`;
P["Feature map"]=`<div class="card rt"><h3>Where each feature lives now</h3>${tw(["Feature","Source","New destination","From Home"],FEAT)}<p class="sm mu">Features marked Task brief or Earlier prototype were not visible in the screenshots. Check the full list and exact routes against the source.</p></div>`;
P["UX rationale"]=`<div class="card rt"><ul><li><b>Keep what works</b>: the sidebar, tutorial, bell, support banner and feedback card all stay, in TIQ's dark navy and orange.</li><li><b>Feed-first Home</b>: search, matched jobs, learning progress and updates replace passive count tiles; the old tiles survive as a clickable overview strip.</li><li><b>Three columns</b>: compact profile and shortcuts, the feed as the focus, then opportunities, interviews and learning suggestions.</li><li><b>Jobs</b>: filters and a scannable list beside a detail pane with a prominent, simulated Apply.</li><li><b>Learning</b>: training, assessments and certificates share a sub-menu and progress summary, and the feed links them to roles.</li><li><b>Profile</b>: identity, about, skills, experience, projects, learning and certificates read as a portfolio.</li><li><b>Search</b>: one box searches jobs, courses and wiki articles.</li><li><b>Two-click access</b>: every section is one click on desktop and two on mobile.</li><li><b>Visual system</b>: TIQ dark navy surfaces with orange for actions and the active item; a light variant is available.</li></ul></div>`;
P["Comparison"]=`<div class="note sm"><b>Method.</b> The three industry sites were opened on 22 Oct 2026 and summarised from their public pages. LinkedIn, Upwork, Coursera and Credly are summarised from public help and blog pages, not the live signed-in products. Upwork, Naukri and Wellfound were checked against their help pages on 22 Oct 2026; Fiverr was not verified. No screenshots are included.</div><div class="card rt">${tw(["Platform","Top navigation","Home / feed","Profile and credibility","What brings users back","Source"],CMP)}<h3>What we take from it</h3><ul class="sm"><li>Naukri and Wellfound: recommended jobs, saved searches with email alerts and application tracking give people a reason to return. Upwork groups work under Find work, Manage work, Messages and earnings.</li><li>OneStopNDT: editorial content and events give people a reason to return. Its footer links both Jobs and Courses, though we did not open those pages.</li><li>Energy JobSearch: a For you tab, alerts and followed companies drive repeat visits.</li><li>NDT Worldwide: training is its entire focus and no jobs were seen there.</li><li>Coursera, LinkedIn and Credly: certificates become shareable proof tied to a profile.</li></ul></div>`;
P["Mobile view"]=`<div class="card rt"><p class="sm mu">Live 390px frames of this same page: Home, Jobs, Learning and Work.</p><div class="row" style="align-items:flex-start;gap:18px">${["home","jobs","training","contracts"].map(h=>`<iframe title="Mobile ${h}" loading="lazy" src="${location.href.split("#")[0]}#${h}" style="width:390px;max-width:100%;height:720px;border:8px solid var(--s2);border-radius:28px;background:var(--bg)"></iframe>`).join("")}</div></div>`;
P["Backend & reuse"]=`<div class="card rt"><h3>Reuse versus new work</h3><p class="sm mu">The reuse column is an estimate based on the screens of the current app.</p>${tw(["Area","Likely reuse","New work"],REUSE)}<h3>Mock versus production</h3>${tw(["Area","In this prototype","Production would need"],BE)}</div>`;
P["Limits & next steps"]=`<div class="card rt"><h3>Limitations</h3><ul><li>Static HTML prototype with dummy data; nothing connects to TIQ World systems and nothing is saved remotely.</li><li>The logo is a stylised placeholder, not the official asset, and the support details are placeholders.</li><li>The app source has not been mapped into this document yet.</li><li>Fiverr, Naukri and Wellfound are unverified.</li></ul><h3>Next steps</h3><ul><li>Review the mock with the product owner before any implementation.</li><li>Check the full route list and sidebar against the source.</li><li>Test with freelancers, including task timing for the two-click goal.</li><li>Run a keyboard and screen-reader audit.</li></ul></div>`;
CMP[4]=["Upwork","Find work menu; Manage work > Your contracts; Messages; earnings and time reports","Dashboard of what is new: invitations, offers, saved jobs, recommendations","Public profile with portfolio, skills and reviews","Invitations, offers, saved jobs, client messages","Help pages, 22 Oct 2026; not the live signed-in app"];
CMP[8]=["Naukri","Search bar plus Recommended Jobs, Saved Jobs, Applications History, Profile Performance","My Naukri home: jobs recommended from profile and activity, with a recruiter profile-views widget","Profile completeness score; recruiter views of your profile; resume upload","Recommended-job emails, followed recruiters, who-viewed-you alerts","Naukri FAQ pages, 22 Oct 2026; not the live signed-in app"];
CMP[9]=["Wellfound","Jobs, Applications (left tab), messaging with companies","Search-first jobs page with filters for salary, equity and remote","Job profile with resume; one-click apply with a short note","Saved searches with email alerts; application status tracking","Wellfound help centre, 22 Oct 2026; not the live signed-in app"];
BE.push(["Messages","Three sample threads","Messaging service, read state, notifications"],["Job alerts and For you","Static sample","Saved searches, alert delivery, ranking on skills and certificates"]);
REUSE.push(["Messages","Notification pipeline","Conversation store and inbox endpoints"],["Job alerts","Job search queries","Saved-search storage and email or push delivery"]);
P["Summary"]=`<div class="grid g2"><div class="card rt"><h3>The problem</h3><ul><li>Funnel-based: users land on a dashboard of counts and mostly stay there.</li><li>Jobs, Training, Assessments and Certificates are separate sections with no links between them.</li><li>No global search or feed, so features are hard to discover.</li><li>Nothing invites browsing, so users have little reason to come back.</li></ul><h3>What changes</h3><ul><li>Home becomes a feed: matched jobs, learning progress, alerts, interviews and updates.</li><li>Six top-level sections replace a long flat list: Home, Jobs, Learning, Work, Messages, Help. Profile and Notifications sit in the header and the You group.</li><li>Learning and Work use tabs, so related items sit together.</li><li>A global search box covers jobs, courses and wiki articles.</li><li>New: Messages, a For you jobs tab and job alerts, to give people reasons to return.</li></ul></div><div class="card rt"><h3>Reuse and new work</h3><ul><li><b>Reused:</b> jobs, courses, assessments, certificates, contracts, notifications and profile data and screens, rearranged.</li><li><b>New front end:</b> feed, search, Messages, alerts, Work and Learning tab bars.</li><li><b>New backend:</b> feed and ranking, unified search, messaging, saved searches. Details are in the Backend &amp; reuse tab.</li></ul><h3>Reach</h3><p>Every feature is within two clicks of Home on desktop, and within two taps on mobile through the bottom bar and More. See the Feature map tab.</p></div></div>`;
P["Navigation map"]=`<div class="grid g2"><div class="card rt"><h3>Before</h3><ul><li>Dashboard (only landing page)</li><li>Jobs</li><li>Contracts</li><li>Training</li><li>Assessments</li><li>Certificates</li><li>Reports</li><li class="mu">Items below Reports were not visible in the reference screens</li></ul><p class="sm mu">One flat sidebar. Header: tutorial button and bell.</p></div><div class="card rt"><h3>After</h3><ul><li><b>Home</b>: feed, alerts, overview strip</li><li><b>Jobs</b>: All, For you, Saved, Applied, then job detail</li><li><b>Learning</b>: Training, Assessments, Certificates, then course</li><li><b>Work</b>: Contracts, Interviews, Activity &amp; Earnings, Reports</li><li><b>Messages</b></li><li><b>Help</b>: Wiki, AI Assistant</li><li><b>Header</b>: search, bell to Notifications, avatar to Profile, then Subscription</li></ul><p class="sm mu">Desktop: a horizontal top navigation bar under the header, with no sidebar. Mobile: bottom bar of Home, Jobs, Learning, Work and More. More opens Messages, Help, Profile and Notifications.</p></div></div>`;
P["Feature map"]=`<div class="card rt"><h3>Where each feature lives now</h3>${tw(["Feature","Status","New location","Clicks from Home"],[["Dashboard overview","Current app","Home feed and overview strip","0"],["Notifications","Current app","Bell, Notifications page","1"],["Jobs, detail, save, apply","Current app","Jobs tabs","1 to 2"],["Contracts and contract PDF","Current app","Work, Contracts","2"],["Interviews","Feature list","Work, Interviews","2"],["Training and courses","Current app","Learning, Training","1 to 2"],["Assessments","Current app","Learning, Assessments","2"],["Certificates","Current app","Learning, Certificates","2"],["Reports","Current app","Work, Reports","2"],["Activity and earnings","Proposed addition","Work, Activity &amp; Earnings","2"],["Wiki","Feature list","Help, Wiki","1"],["AI assistant","Feature list","Help, AI Assistant","2"],["Profile and editing","Feature list","Avatar in the header","1"],["Subscription","Proposed addition","Profile, Account, Subscription","2"],["Messages","New","Messages","1"],["Job alerts and For you","New","Home card, Jobs tab","0 to 1"],["Global search","New","Header","0"],["Tutorial, banner, feedback","Current app","Header, every page, top bar","0"]])}<p class="sm mu">Rows marked Proposed addition are not part of the reference app and can be dropped without affecting the rest of the design.</p></div>`;
P["Limits & next steps"]=`<div class="card rt"><h3>Limitations</h3><ul><li>Static HTML prototype with dummy data; nothing connects to TIQ World systems and nothing is saved remotely.</li><li>The logo is a stylised placeholder, and the support details are placeholders.</li><li>The current-state observations are based on the current TIQ World app (staging). Screens not visible there are not shown.</li><li>Fiverr was not verified. Other platforms are summarised from public help pages, not live signed-in products. No screenshots are included.</li></ul><h3>Next steps</h3><ul><li>Review the mock with the product owner before implementation.</li><li>Decide whether to keep the proposed additions (Activity &amp; Earnings, Subscription).</li><li>Test the two-click goal with freelancers, and run a keyboard and screen-reader audit.</li></ul></div>`;
return head("Design rationale","Why the freelancer experience moves from a dashboard-only flow to a discovery-first platform.")+tabs("rt",T)+P[t]};
/* ===== MODALS ===== */
const M={g:i=>{const m=MSGS.find(x=>x[0]==i);return `<h2>${m[1]}</h2><p class="mu sm">${m[2]}</p><p>${m[3]}</p><p class="sm mu">Simulated thread. Nothing is sent.</p>`},c:i=>{const c=CONTRACTS.find(x=>x[0]==i);return `<h2>${c[1]}</h2><p>${st(cst(c))}</p><p>${c[2]}<br>${c[4]} → ${c[5]}</p><p>${c[7]}</p>${pb(c[6])}${cst(c)=="Pending"?`<div class="row" style="margin-top:12px"><button class="btn p" data-act="sign:${i}">Accept contract (demo)</button><button class="btn" data-act="rej:${i}">Decline (demo)</button></div><p class="sm mu">Simulated. No signature is recorded.</p>`:""}`},
a:i=>{const a=ASSESS.find(x=>x[0]==i);return `<h2>${a[1]}</h2><p>${st(S.as[i]||a[4])}</p><p>${a[2]} assessment · ${a[3]}<br>${a[5]}</p><p class="sm mu">Simulated. Nothing is graded.</p>`},
s:i=>{const c=CERTS.find(x=>x[0]==i);return `<h2>${c[1]}</h2><p>${c[2]}<br>Issued ${c[3]}<br>Reference ${c[4]}</p><p class="sm mu">Demo record. Not a genuine credential.</p>`},
i:i=>{const c=INTERVIEWS.find(x=>x[0]==i);return `<h2>${c[1]}</h2><p>${c[2]}<br>${c[3]} · ${c[4]}</p><p>${st(c[5])}</p><p class="sm mu">Illustrative details.</p>`},
w:i=>{const w=WIKI.find(x=>x[0]==i);return `<h2>${w[1]}</h2><span class="tag">${w[2]}</span><p>${w[3]}</p><p class="sm mu">Sample article.</p>`}};
/* ===== ROUTER ===== */
function render(){const k=R[S.scr]?S.scr:"home";$("#main").innerHTML=`<div class="wrap">${S.hb?"":`<div class="bnr" role="note"><span><b>Help is always here.</b> Facing any problem? Email us: <span class="hl">support@example.com</span> | Call us: <span class="hl">+00 0000 000000</span> (demo details)</span><button class="lk" data-act="hb" aria-label="Dismiss banner">✕</button></div>`}${gbar(k)}${R[k]()}<p class="demo">Static prototype · fictional data · no backend</p></div>`;chrome()}
function go(s,id){$("#sg").hidden=true;S.scr=s;S.id=id||null;S.q="";S.f={};location.hash=s+(id?"/"+id:"");$("#app").classList.remove("open");scrollTo(0,0)}
function fromHash(){const [s,id]=location.hash.slice(1).split("/");if(s=="activity"){S.tab.ae="Activity";S.scr="earnings";S.id=null;return render()}S.scr=R[s]?s:"home";S.id=id?+id:null;render()}
addEventListener("hashchange",fromHash);addEventListener("resize",chrome);
const live=()=>{const l=$("#ls");if(l)l.innerHTML=L[S.scr]();const d=$("#dt");if(d)d.innerHTML=jobPane()};
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-act],[data-tab]");if(!t)return;
 if(t.dataset.go){const [s,id]=t.dataset.go.split(":");return go(s,id)}
 if(t.dataset.tab){const [k,v]=t.dataset.tab.split(":");S.tab[k]=v;return render()}
 const [a,x,y]=t.dataset.act.split(":");
 if(a=="theme")return setTheme(x);
 if(a=="themetoggle")return setTheme(S.theme=="nightfall"?"sunlit":"nightfall");
 if(a=="search"){$("#gs").classList.toggle("show");return $("#gq").focus()}
 if(a=="menu")return $("#app").classList.toggle("open");
 if(a=="collapse")return $("#app").classList.toggle("col");
 if(a=="close")return $("#dlg").close();
 if(a=="back")return history.length>1?history.back():go("home");
 if(a=="m"){return modal(M[x](+y))}
 if(a=="sj"){const i=+x;S.sj.has(i)?S.sj.delete(i):S.sj.add(i);toast(S.sj.has(i)?"Job saved":"Removed from saved");S.scr=="jobs"?(render()):render()}
 else if(a=="sc"){const i=+x;S.sc.has(i)?S.sc.delete(i):S.sc.add(i);toast(S.sc.has(i)?"Course saved":"Removed from saved");render()}
 else if(a=="apply"){S.applied.add(+x);modal(`<h2>Application sent (demo)</h2><p>This is a simulation. No application was submitted.</p>`);render()}
 else if(a=="learn"){const i=+x;if(!S.enr.has(i)){S.enr.add(i);toast("Enrolled (demo)")}else toast("Opening lesson (simulated)");render()}
 else if(a=="start"){S.as[+x]="In progress";toast("Assessment started (simulated)");render()}
 else if(a=="fin"){S.as[+x]="Completed";toast("Assessment completed (simulated)");render()}
 else if(a=="plan"){S.plan=x;toast("Plan changed to "+x+" (demo)");render()}
 else if(a=="read"){S.read.add(+x);render()}
 else if(a=="readall"){NOTIFS.forEach(n=>S.read.add(n[0]));toast("All marked as read");render()}
 else if(a=="edit"){if(S.edit){S.head=$("#hd").value||S.head;S.about=$("#ab").value||S.about;toast("Saved in this page only (demo). Nothing was sent.")}S.edit=!S.edit;render()}
 else if(a=="skill"){(S.extra=S.extra||[]).push(x);toast(x+" added to profile (demo)")}
 else if(a=="chat"){const p=PROMPTS[+x];S.chat.push(["u",p[0]],["",p[1]]);render()}
 else if(a=="reset"){S.f={};S.q="";render()}
 else if(a=="sel"){S.jsel=+x;if(innerWidth<=900)return go("job",x);live()}
 else if(a=="gt"){const [sc,k,v]=x.split("|");S.tab[k]=v;go(sc);render()}
 else if(a=="q"){S.gq=x;go("search");render()}
 else if(a=="addskill"){const v=$("#sk").value.trim();S.head=$("#hd").value||S.head;S.about=$("#ab").value||S.about;if(v)(S.extra=S.extra||[]).push(v);render();toast(v?v+" added (demo)":"Type a skill first")}
 else if(a=="cancel"){S.edit=false;render()}
 else if(a=="sign"){S.cs[+x]="Accepted";$("#dlg").close();S.tab.ct="Accepted";render();toast("Contract accepted (demo). Nothing was signed.")}
 else if(a=="rej"){S.cs[+x]="Rejected";$("#dlg").close();S.tab.ct="Rejected";render();toast("Contract declined (demo).")}
 else if(a=="hb"){S.hb=true;render()}
 else if(a=="fb"){modal(`<h2>Help us improve</h2><label class="sm">Your feedback<br><textarea id="fbt" rows="4" style="width:100%"></textarea></label><div class="row" style="margin-top:10px"><button class="btn p" data-act="fbsend">Send (demo)</button></div><p class="sm mu">Simulated. Nothing is sent.</p>`)}
 else if(a=="fbsend"){$("#dlg").close();toast("Thanks. Feedback is simulated and was not sent.")}
 else if(a=="tour"){const n=+x,T=[["Home feed","Your feed shows matched jobs, learning progress and updates. Use the search box to find jobs and courses."],["Jobs","Filter roles, open one in the side pane, then apply (simulated)."],["Learning","Training, Assessments and Certificates sit together with one progress summary."],["Everything else","Work holds Contracts, Interviews, Earnings and Reports. Messages, Help and Profile are one click away in the top bar and header."]];modal(`<h2>Quick tour · ${n+1} of ${T.length}</h2><h3>${T[n][0]}</h3><p>${T[n][1]}</p>`+(n<T.length-1?`<div class="row"><button class="btn p" data-act="tour:${n+1}">Next</button></div>`:""))}
 else if(a=="toast")toast(x);
});
document.addEventListener("input",e=>{if(e.target.id=="q"){S.q=e.target.value;live()}});
document.addEventListener("change",e=>{const k=e.target.dataset.f;if(k){S.f[k]=e.target.value;if(k=="rng")S.rng=e.target.value;if(k=="period")S.period=e.target.value;if(k=="nf")S.nf=e.target.value;["rng","period","nf"].includes(k)?render():live()}});
document.addEventListener("submit",e=>{const cf=e.target.closest("[data-chatf]");if(cf){e.preventDefault();const i=$("#cq"),v=i.value.trim();if(!v)return;S.chat.push(["u",esc(v)],["",BOT(v)]);render();const m=$(".msgs");m.scrollTop=m.scrollHeight;$("#cq").focus();return}const f=e.target.closest("[data-search]");if(!f)return;e.preventDefault();const i=document.getElementById(f.dataset.search),v=i.value.trim();if(!v)return toast("Type a job, skill or course to search");S.gq=v;go("search");render();i.value="";$("#gs").classList.remove("show")});
function sugg(){const q=$("#gq").value.trim().toLowerCase(),b=$("#sg");if(q.length<2){b.hidden=true;return}const r=JOBS.filter(x=>(x[1]+x[2]+x[8].join(" ")).toLowerCase().includes(q)).slice(0,4).map(x=>`<button role="option" data-go="job:${x[0]}">${x[1]}<small>Job · ${x[2]}</small></button>`).concat(COURSES.filter(x=>x[1].toLowerCase().includes(q)).slice(0,3).map(x=>`<button role="option" data-go="course:${x[0]}">${x[1]}<small>Course · ${x[2]}</small></button>`));b.innerHTML=r.join("")||'<div class="sm mu" style="padding:10px 12px">No matches. Press Enter to search anyway.</div>';b.hidden=false}
document.addEventListener("input",e=>{if(e.target.id=="gq")sugg()});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){$("#sg").hidden=true;$("#gs").classList.remove("show")}});
document.addEventListener("click",e=>{if(!e.target.closest("#gs"))$("#sg").hidden=true});
document.addEventListener("click",e=>{const a=$("#app");if(a.classList.contains("open")&&!e.target.closest("#side,[data-act=menu]"))a.classList.remove("open");if(e.target===$("#dlg"))$("#dlg").close()});
document.addEventListener("keydown",e=>{if(e.key=="Escape")$("#app").classList.remove("open")});
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;try{localStorage.setItem("tiq-theme2",t)}catch(e){}chrome()}
setTheme(S.theme=="sunlit"?"sunlit":"nightfall");fromHash();
</script>
