<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--o:#E77A2E;--n:#2A1620;--bur:#7A1F3D;--grn:#1F6B4F;--b:#1F6B4F;--sand:#F2E8D5;--card:#FBF6EA;--pb:#F0DFC0;--l:#E3C29B;--gl:rgba(231,122,46,.34);--g:#F3EBDB;--t:#6B5A47;--ok:#1F6B4F}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 "Space Grotesk",system-ui,sans-serif;color:var(--n);background:var(--sand);min-height:100vh}
.cols{position:fixed;inset:0;z-index:-1;pointer-events:none;display:flex;justify-content:center}
.cols{background:linear-gradient(var(--gl) 1px,transparent 1px) 0 0/100% 64px}.cols i{width:min(1280px,100%);background:linear-gradient(90deg,var(--gl) 1px,transparent 1px) 0 0/calc(100%/12) 100%}
.cols i{border-right:1px solid var(--gl)}
a,button{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.mono{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(242,232,213,.94);border-bottom:1px solid var(--l);backdrop-filter:blur(6px)}
.top{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.brand img{width:34px;height:35px}.brand b{display:block;font-size:17px;line-height:1;letter-spacing:.02em}
.brand span{color:var(--o);font-size:10px}
.sp{flex:1}
.pill{border:1px solid var(--l);background:var(--card);border-radius:3px;padding:6px 12px;font-size:13px;transition:.15s}
.pill:hover{border-color:var(--n)}
.pill.pr{background:var(--o);border-color:var(--o);color:#fff;font-weight:500}.pill.pr:hover{filter:brightness(.93)}
.wikibtn{display:flex;gap:6px;align-items:center}.wikibtn em{font:normal 10px/1 "JetBrains Mono";background:var(--pb);color:var(--b);padding:2px 5px}
.user{display:flex;gap:8px;align-items:center;position:relative}
.av{width:32px;height:32px;border:1px solid var(--l);background:var(--pb);display:grid;place-items:center;font-size:12px;font-weight:700}
.menu{position:absolute;right:0;top:44px;width:190px;background:var(--card);border:1px solid var(--n);display:none}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--l);background:var(--card);padding:10px 12px}
.menu button:hover{background:var(--pb)}.menu button:last-child{color:#B42318;border:0}
nav{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--l)}
.grp{display:flex;border-right:1px solid var(--l);padding-right:4px;margin-right:4px;flex:none;align-items:stretch}
.grp small{align-self:center;color:var(--t);padding:0 8px 0 2px}
nav a{display:flex;align-items:center;padding:11px 12px;text-decoration:none;color:var(--t);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
nav a:hover{color:var(--n);background:var(--g)}
nav a.on{color:var(--n);border-color:var(--o);background:var(--pb);font-weight:500}
nav a i{font:normal 10px "JetBrains Mono";background:var(--pb);color:var(--b);margin-left:6px;padding:1px 4px}
main{padding:28px 16px 60px}
.eyebrow{color:var(--o)}.eyebrow:before{content:"▪ "}
h1{font-size:clamp(26px,4vw,40px);margin:4px 0 4px;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05}
.sub{color:var(--t);margin:0 0 22px;max-width:640px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);border-top:1px solid var(--l);border-left:1px solid var(--l);margin-bottom:24px}
.c{border-right:1px solid var(--l);border-bottom:1px solid var(--l);padding:18px;background:rgba(251,246,234,.78);grid-column:span 12;transition:.15s;min-width:0;text-align:left}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}
@media(max-width:1000px){.s2,.s3,.s4{grid-column:span 6}.s5,.s6,.s7,.s8{grid-column:span 12}}
@media(max-width:560px){.s2,.s3,.s4{grid-column:span 12}.top .hide{display:none}}
button.c{border-top:0;border-left:0}button.c:hover,a.c:hover,.job:hover{background:var(--pb)}
.stat b{display:block;font-size:34px;line-height:1.1;margin-top:6px}.stat span{color:var(--t);font-size:13px}
.stat.sel{box-shadow:inset 0 3px 0 var(--o)}
.lbl{color:var(--t)}
.ic{width:22px;height:22px;stroke:var(--bur);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px;display:block}
.tag{display:inline-block;border:1px solid var(--l);background:var(--g);font-size:12px;padding:1px 7px;margin:0 4px 4px 0}
.tag.o{border-color:#F3C4A0;background:#FFF3EA;color:#A8480C}.tag.b{background:#E3F0E8;border-color:#B5D6C3;color:#17553E}
.note{border-left:3px solid var(--o);background:rgba(231,122,46,.13);padding:12px 16px;margin-bottom:20px;font-size:14px;display:flex;gap:12px;justify-content:space-between}
.note ul{margin:4px 0 0;padding-left:18px}.note button{border:0;background:none;font-size:18px;align-self:flex-start}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--l);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;color:var(--t);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--n);border-color:var(--o);font-weight:500;background:var(--pb)}
.tabs button i{font:normal 11px "JetBrains Mono";background:var(--g);padding:1px 5px;margin-left:5px;border:1px solid var(--l)}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:18px;align-items:flex-end}
.chip{border:1px solid var(--l);background:var(--card);padding:3px 11px;font-size:13px;border-radius:99px;margin:0 6px 0 0}
.chip.on{background:var(--n);color:#fff;border-color:var(--n)}.chip:hover{border-color:var(--n)}
input,select{font:inherit;border:1px solid var(--l);background:var(--card);padding:8px 10px;min-width:0;border-radius:2px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--b);border-color:var(--b)}
textarea{font:inherit;width:100%;border:1px solid var(--l);padding:10px;min-height:90px}
.job{display:flex;flex-direction:column;gap:8px}.job h3{margin:0;font-size:18px;color:var(--n)}.job p{margin:0;color:var(--t);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--t)}.rec{color:var(--o)}
.empty{text-align:center;padding:48px 16px}.empty h3{margin:6px 0 4px}.empty p{color:var(--t);margin:0 0 14px}
.empty .ic{margin:0 auto 10px;width:34px;height:34px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--t);padding:8px;border-bottom:1px solid var(--l);font:500 11px "JetBrains Mono";text-transform:uppercase}
.bar{height:6px;background:var(--g);border:1px solid var(--l)}.bar i{display:block;height:100%;background:var(--o)}
.plan.cur{box-shadow:inset 0 3px 0 var(--o)}.plan ul{list-style:none;padding:0;margin:12px 0;font-size:14px}.plan li:before{content:"✓ ";color:var(--ok)}
.price{font-size:30px;font-weight:700}
.wiki{text-align:center;padding:36px 16px}.wiki h2{font-size:clamp(24px,4vw,36px);margin:8px 0}
.ask{display:flex;gap:8px;max-width:640px;margin:18px auto 6px;border:1px solid var(--n);padding:6px;background:var(--card);box-shadow:4px 4px 0 var(--o)}
.ask input{flex:1;border:0}.ask input:focus{outline:0}
.sug{display:grid;grid-template-columns:1fr 1fr;gap:0;max-width:640px;margin:18px auto 0;border-top:1px solid var(--l);border-left:1px solid var(--l)}
.sug button{text-align:left;border:0;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:var(--card);padding:12px;font-size:13px}.sug button:hover{background:var(--pb)}
@media(max-width:560px){.sug{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;background:rgba(42,22,32,.5);display:none;place-items:center;z-index:50;padding:16px}.modal.on{display:grid}
.box{background:var(--card);border:1px solid var(--n);max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.opt{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--l);border-left:1px solid var(--l);margin:8px 0 14px}
.opt button{text-align:left;border:0;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:var(--card);padding:9px 11px;font-size:13px}.opt button.on{background:var(--pb);box-shadow:inset 3px 0 0 var(--o)}
.stars button{border:0;background:none;font-size:22px;color:var(--l);padding:0 2px}.stars button.on{color:var(--o)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;font-size:13px;z-index:60;display:none;max-width:90vw}
.fb{position:fixed;right:16px;bottom:16px;z-index:15;background:var(--card);border:1px solid var(--n);padding:8px 12px;font-size:13px;box-shadow:3px 3px 0 var(--o)}
footer{border-top:1px solid var(--l);padding:14px 16px;color:var(--t);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.proto .pill{color:var(--n)}.proto{background:var(--bur);color:#fff;font-size:12px;text-align:center;padding:5px 8px}

/* ===== glow & motion layer ===== */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.c{position:relative}
.c::after{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(231,122,46,.16),transparent 62%);opacity:0;transition:opacity .25s;pointer-events:none}
.c:hover::after{opacity:1}
.c:hover{box-shadow:inset 0 0 0 1px rgba(231,122,46,.6),0 0 26px rgba(231,122,46,.2);z-index:2}
.c::before{content:"+";position:absolute;right:-5px;bottom:-9px;font:500 11px/1 "JetBrains Mono",monospace;color:var(--b);opacity:.55;z-index:3;pointer-events:none}
.bento .c{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.bento .c:nth-child(2){animation-delay:.05s}.bento .c:nth-child(3){animation-delay:.1s}.bento .c:nth-child(4){animation-delay:.15s}.bento .c:nth-child(5){animation-delay:.2s}.bento .c:nth-child(6){animation-delay:.25s}.bento .c:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1::after{content:"";display:inline-block;width:.42em;height:.09em;margin-left:.18em;background:var(--o);box-shadow:0 0 12px var(--o);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
header::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:30%;background:linear-gradient(90deg,transparent,var(--o),transparent);box-shadow:0 0 12px var(--o);animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%{left:-30%}100%{left:100%}}
nav a.on{box-shadow:0 10px 18px -12px var(--o)}
.pill.pr{box-shadow:0 6px 18px -6px rgba(231,122,46,.7)}.pill.pr:hover{box-shadow:0 0 0 3px rgba(231,122,46,.25),0 8px 24px -4px rgba(231,122,46,.8)}
.stat.sel{box-shadow:inset 0 3px 0 var(--o),0 0 22px rgba(231,122,46,.15)}
.tag.o:first-child:not(:only-child){position:relative}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--o);margin-right:6px;box-shadow:0 0 0 0 rgba(231,122,46,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(231,122,46,0)}100%{box-shadow:0 0 0 0 rgba(231,122,46,0)}}
.hero{position:relative;display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:28px;margin-bottom:24px;border:1px solid var(--l);overflow:hidden;
 background:radial-gradient(380px 200px at 6% 100%,rgba(31,107,79,.2),transparent 70%),radial-gradient(520px 260px at 88% 50%,rgba(231,122,46,.20),transparent 70%),linear-gradient(var(--gl) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--gl) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(#FBF3E2,#F3E6CC);background-blend-mode:normal}
.hero::before,.hero::after{content:"";position:absolute;pointer-events:none}
.hero::after{top:0;bottom:0;width:90px;left:-90px;background:linear-gradient(90deg,transparent,rgba(231,122,46,.28),transparent);animation:scan 6s linear infinite}
@keyframes scan{to{left:110%}}
.hero>*{position:relative;z-index:1}
.hero h2{margin:6px 0 14px;font-size:clamp(24px,3.6vw,38px);line-height:1.1;letter-spacing:-.01em;max-width:620px}
.glowtxt{color:var(--o);text-shadow:0 0 24px rgba(231,122,46,.5)}
.orb{position:relative;width:110px;height:110px;flex:none}
.orb img{position:absolute;inset:16px;width:78px;height:auto;filter:drop-shadow(0 0 16px rgba(231,122,46,.75));animation:float 4s ease-in-out infinite}
.orb i{position:absolute;inset:0;border:1px dashed var(--o);border-radius:50%;animation:rot 14s linear infinite}
.orb i::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--b);box-shadow:0 0 12px var(--b)}
.orb b{position:absolute;inset:-12px;border:1px solid rgba(31,107,79,.25);border-radius:50%;animation:rot 22s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-5px)}}
.wiki{background:radial-gradient(circle at 50% 24%,rgba(231,122,46,.18),transparent 42%),radial-gradient(circle at 50% 70%,rgba(31,107,79,.08),transparent 50%),rgba(251,246,234,.78)}
.wiki img{filter:drop-shadow(0 0 18px rgba(231,122,46,.7));animation:float 4s ease-in-out infinite}
.ask{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--a),var(--o),var(--b),var(--bur),var(--o)) border-box;animation:spin 5s linear infinite;box-shadow:0 0 34px rgba(231,122,46,.28),0 0 60px rgba(122,31,61,.18)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== sand + burgundy + green ===== */
.mono.lbl,.grp small{color:var(--bur)}
.bento .stat:nth-child(3n+1){border-top:3px solid var(--bur)}.bento .stat:nth-child(3n+2){border-top:3px solid var(--grn)}.bento .stat:nth-child(3n){border-top:3px solid var(--o)}
.bento .c:nth-child(even) .ic{stroke:var(--grn)}
.chip.on{background:var(--bur);border-color:var(--bur)}
.hero{border-left:4px solid var(--bur)}
.bar i{background:linear-gradient(90deg,var(--grn),var(--o))}
.price{color:var(--bur)}.av{color:var(--bur);font-weight:700}
.tag.b{font-weight:500}
.plan.cur{box-shadow:inset 0 3px 0 var(--grn)}
.menu{border-color:var(--bur)}
.sug button:hover,.opt button.on{box-shadow:inset 3px 0 0 var(--bur)}
.wiki .mono.eyebrow span:last-child{color:var(--bur)}
.bento .stat.sel{border-top-color:var(--o)}

/* ===== TIQWiki enchanted ===== */
.wikiX{position:relative;overflow:hidden;text-align:center;color:#F6EAD6;border:1px solid var(--bur);margin-bottom:24px;min-height:680px;background:radial-gradient(ellipse at 50% -10%,#5A1633 0%,#2A1620 52%,#170B11 100%)}
.wikiX::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(231,122,46,.13) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(231,122,46,.13) 1px,transparent 1px) 0 0/calc(100%/12) 100%;pointer-events:none;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%)}
.wikiX canvas{position:absolute;inset:0;width:100%;height:100%}
.aur{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.42;animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
.a1{background:var(--o);left:-120px;top:-140px}.a2{background:var(--grn);right:-140px;bottom:-160px;animation-delay:-4s}.a3{background:var(--bur);left:38%;top:30%;opacity:.5;animation-delay:-8s}

.shim{font-size:clamp(30px,5.4vw,56px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.02em;background:linear-gradient(100deg,#F6EAD6 20%,#E77A2E 40%,#fff 50%,#5EBE96 60%,#F6EAD6 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-250% 0}}
.wsub{color:rgba(246,234,214,.75);max-width:560px;margin:0 auto 26px}
.askX{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:700px;margin:0 auto 8px;padding:10px 12px;border:2px solid transparent;border-radius:6px;background:linear-gradient(#1D0E15,#1D0E15) padding-box,conic-gradient(from var(--a),var(--o),var(--grn),#C84C78,var(--o)) border-box;animation:spin 4s linear infinite;box-shadow:0 0 40px rgba(231,122,46,.35),0 0 90px rgba(200,76,120,.2);transition:.3s}
.askX:focus-within{box-shadow:0 0 60px rgba(231,122,46,.65),0 0 120px rgba(94,190,150,.25);transform:scale(1.015)}

.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--o);color:#fff;font-size:20px;box-shadow:0 0 20px var(--o);transition:.2s}.send:hover{transform:scale(1.12) rotate(-8deg)}
.wnote{font-size:12px;color:rgba(246,234,214,.55)}
.sugX{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.sugX button{position:relative;text-align:left;padding:16px 38px 16px 16px;color:#F6EAD6;background:rgba(255,255,255,.05);border:1px solid rgba(231,122,46,.35);backdrop-filter:blur(6px);font-size:14px;transition:.25s}
.sugX button em{display:block;font:normal 11px "JetBrains Mono";color:var(--o);margin-bottom:6px;letter-spacing:.1em}.sugX button span{position:absolute;right:14px;top:14px;color:var(--o)}
.sugX button:hover{transform:translateY(-4px);background:rgba(231,122,46,.12);border-color:var(--o);box-shadow:0 10px 30px -8px rgba(231,122,46,.6),inset 0 0 0 1px rgba(231,122,46,.4)}

.bq{background:rgba(231,122,46,.2);border:1px solid rgba(231,122,46,.6);padding:10px 14px;margin:12px 0 8px auto;width:fit-content;max-width:85%;text-align:left}
.ba{border:1px solid rgba(246,234,214,.22);background:rgba(255,255,255,.06);padding:14px;text-align:left;margin-bottom:8px;font-size:14px}
.ba i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--o);margin-right:6px;animation:dots 1s infinite}.ba i:nth-child(2){animation-delay:.15s}.ba i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{transform:translateY(-6px);opacity:.4}}

 testing standards, inspection methods and quality procedures. Answers come with their sources.</p><form class="askX" id="ask"><input id="q" aria-label="Ask TIQWiki" placeholder="Ask about testing standards..." autocomplete="off"><div class="row"><select aria-label="Model"><option>Knowtron Ultra 1.0</option></select><button class="send" aria-label="Send">↑</button></div></form><div class="wnote">TIQWiki can make mistakes. Check important details against the standard.</div><div id="chat"></div><div class="sugX">${WQ.map((s,i)=>`<button data-sug="${s}"><em>0${i+1}</em>${s}<span>↗</span></button>`).join('')}</div></div></div>`};
function wikiInit(){const cv=$('#stars');if(!cv)return;const x=cv.getContext('2d');let W,H,P=[];const r=cv.parentElement.getBoundingClientRect();W=cv.width=r.width;H=cv.height=r.height;const cs=['231,122,46','246,234,214','94,190,150','200,80,120'];P=Array.from({length:Math.round(W*H/15000)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.7+.4,c:cs[Math.floor(Math.random()*4)]}));
(function f(){if(!document.body.contains(cv))return;x.clearRect(0,0,W,H);P.forEach((p,i)=>{p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;x.fillStyle='rgba('+p.c+',.9)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<115){x.strokeStyle='rgba(231,122,46,'+(.2*(1-d/115))+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});requestAnimationFrame(f)})();
const inp=$('#q');let qi=0,ci=0,del=false;inp.onfocus=()=>inp.placeholder='Ask about testing standards...';(function ty(){if(!document.body.contains(inp))return;if(document.activeElement!==inp&&!inp.value){const s=WQ[qi];ci+=del?-2:1;inp.placeholder=s.slice(0,Math.max(ci,0))+'▍';if(!del&&ci>=s.length+28)del=true;if(del&&ci<=0){del=false;qi=(qi+1)%WQ.length}}setTimeout(ty,del?16:40)})()}
let pc=0;
function nav(r){$('#nav').innerHTML=NAV.map(g=>`<div class="grp"><small class="mono">${g[0]}</small>${g[1].map(i=>`<a href="#${i[0]}" class="${r==i[0]?'on':''}" ${r==i[0]?'aria-current="page"':''}>${i[1]}${i[2]?`<i>${i[2]}</i>`:''}</a>`).join('')}</div>`).join('')}
function cur(){const r=(location.hash||(st.auth?'#dashboard':'#home')).slice(1);return !st.auth?'home':(R[r]?r:'dashboard')}
function draw(){const k=cur();document.body.classList.toggle('pub',!st.auth);nav(k);$('#app').innerHTML=R[k]();document.title=k=='home'?'TIQ World — Jobs, training, reports and TIQWiki for quality professionals':'TIQ World · '+NAV.flatMap(g=>g[1]).find(i=>i[0]==k)[1];scrollTo(0,0);countUp();if(k=='tiqwiki')wikiInit()}
function redraw(){const y=scrollY;$('#app').innerHTML=R[cur()]();scrollTo(0,y)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}
function modal(h){$('#box').innerHTML=h;$('#modal').classList.add('on')}function closeM(){$('#modal').classList.remove('on')}
function fb(){let kind='',stars=0;modal(`<div style="display:flex;justify-content:space-between"><b class="mono">Share your feedback</b><button data-x style="border:0;background:none;font-size:20px" aria-label="Close">×</button></div><p class="meta">Help us improve TIQ World. Your thoughts matter!</p><b class="meta">What kind of feedback? *</b><div class="opt">${[['Bug Report','Something is broken'],['Feature Request','I have an idea'],['General Feedback','Thoughts & suggestions'],['Praise','Something I love'],['Account Request','Manage or delete my account']].map(o=>`<button data-k="${o[0]}"><b>${o[0]}</b><br><span class="meta">${o[1]}</span></button>`).join('')}</div><b class="meta">Overall experience (optional)</b><div class="stars">${[1,2,3,4,5].map(n=>`<button data-star="${n}" aria-label="${n} stars">★</button>`).join('')}</div><b class="meta">Tell us more *</b><textarea id="ft" maxlength="5000" placeholder="Tell us what you think — bugs, ideas, anything..."></textarea><div class="meta" style="text-align:right" id="fc">0/5000</div><label class="meta"><input type="checkbox"> I’m okay with TIQ World contacting me about this feedback</label><p class="meta">Need direct support? support@tiqworld.com</p><button class="pill pr" style="width:100%" id="fs">Submit Feedback</button>`);
$('#box').onclick=e=>{const k=e.target.closest('[data-k]'),s=e.target.closest('[data-star]');if(k){kind=k.dataset.k;document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',b==k))}if(s){stars=+s.dataset.star;document.querySelectorAll('[data-star]').forEach(b=>b.classList.toggle('on',+b.dataset.star<=stars))}if(e.target.closest('[data-x]'))closeM();if(e.target.id=='fs'){if(!kind||!$('#ft').value.trim())return toast('Choose a feedback type and tell us more first.');closeM();toast('Prototype: feedback was not actually sent.')}};
$('#ft').oninput=e=>$('#fc').textContent=e.target.value.length+'/5000'}
document.addEventListener('click',e=>{const t=e.target;let x;
if(!t.closest('.user'))$('#menu').classList.remove('on');
if(x=t.closest('[data-signin]')){st.auth=true;location.hash=x.dataset.signin||'dashboard';draw()}
else if(x=t.closest('[data-logout]')){st.auth=false;$('#menu').classList.remove('on');location.hash='home';draw()}
else if(x=t.closest('[data-scroll]'))document.getElementById(x.dataset.scroll).scrollIntoView({behavior:'smooth'});
else if(x=t.closest('[data-go]'))location.hash=x.dataset.go;
else if(x=t.closest('[data-tab]')){st[x.dataset.tab]=x.dataset.v;redraw()}
else if(x=t.closest('[data-chip]')){const a=st[x.dataset.chip],v=x.dataset.v;a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);redraw()}
else if(x=t.closest('[data-close]')){st.note[x.dataset.close]=1;redraw()}
else if(x=t.closest('[data-toast]'))toast(x.dataset.toast);
else if(x=t.closest('[data-job]')){const j=JOBS[x.dataset.job];modal(`<div style="display:flex;justify-content:space-between"><span class="mono eyebrow">Job</span><button data-x style="border:0;background:none;font-size:20px" aria-label="Close">×</button></div><h2 style="margin:4px 0">${j.t}</h2><p class="meta">${j.loc} · ${j.m} · ${j.ty}${j.pos?' · '+j.pos:''}<br>${j.dt} · Apply by ${j.ap}</p><p>${j.d}</p><div>${j.sk.map(s=>`<span class="tag b">${s}</span>`).join('')}</div><p class="meta">The full job-detail and apply screens were not shown in the video, so Apply is not built here.</p>`);$('#box').onclick=e=>{if(e.target.closest('[data-x]'))closeM()}}
else if(x=t.closest('[data-demo]')){st.demo=!st.demo;x.textContent='Preview filled screens: '+(st.demo?'On':'Off');redraw()}
else if(x=t.closest('[data-sug]')){$('#q').value=x.dataset.sug;$('#q').focus()}
if(t.closest('#theme'))setTheme(document.documentElement.dataset.theme!='dark');if(t.id=='modal')closeM();if(t.closest('#umb'))$('#menu').classList.toggle('on');if(t.closest('#fbb'))fb()});
document.addEventListener('submit',e=>{if(e.target.id=='ask'){e.preventDefault();const q=$('#q').value.trim();if(!q)return toast('Type a question first.');const id='p'+(++pc);$('#chat').insertAdjacentHTML('beforeend',`<div class="bq">${esc(q)}</div><div class="ba" id="${id}"><i></i><i></i><i></i></div>`);$('#q').value='';setTimeout(()=>{const p=document.getElementById(id);if(p)p.innerHTML='<b class="mono" style="color:var(--o)">Prototype</b><br>TIQWiki answers are not generated in this prototype. In the live product the reply appears here with its sources.'},1400)}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeM();$('#menu').classList.remove('on')}});
function countUp(){document.querySelectorAll('.stat b,.cnt').forEach(el=>{const n=parseInt(el.textContent);if(isNaN(n)||n===0||String(n)!==el.textContent.trim())return;const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.c');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}});
function setTheme(d){document.documentElement.dataset.theme=d?'dark':'light';$('#theme').textContent=d?'☀':'🌙';try{localStorage.setItem('tiqtheme',d?'dark':'light')}catch(e){}}
let _s=null;try{_s=localStorage.getItem('tiqtheme')}catch(e){}
setTheme(_s?_s=='dark':matchMedia('(prefers-color-scheme: dark)').matches);
addEventListener('hashchange',draw);draw();
</script></body></html>
